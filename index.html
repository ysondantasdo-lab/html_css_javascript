<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 1 - Básico</title>
    <style>
        /* Seletor de tag universal para reset segundo padrões modernos */
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        body {
          font-family: sans-serif;
          padding: 20px;
        }
        /* Seletor de classe */
        .cartao {
          border: 2px solid #333;
          padding: 1rem;
          margin-top: 20px;
          border-radius: 4px;
        }
        /* Seletor de ID */
        #titulo-principal {
          color: #2c3e50;
          margin-bottom: 10px;
        }
        p {
          margin-bottom: 15px;
        }
        button {
          padding: 8px 16px;
          cursor: pointer;
          background-color: #0066cc;
          color: white;
          border: none;
          border-radius: 4px;
        }
        /* Adicionado estilo para ocultar o link inicialmente */
        .aviso-link {
          display: none; 
          margin-top: 15px;
          color: #e74c3c;
          font-weight: bold;
          text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <article class="cartao">
            <h1 id="titulo-principal">Aprendendo Web</h1>
            <p>Tecnologias fundamentais integradas.</p>
            <button id="btn-acao">Interagir</button>

            <!-- CORREÇÃO: Tag <a> fechada corretamente com </a> -->
            <a id="link-redirecionamento" class="aviso-link" href="modulo2.html">
                Aguarde... Redirecionando para o Módulo 2 em 3 segundos.
            </a>
        </article>
    </main>

    <script> 
        const botao = document.querySelector('#btn-acao');
        const titulo = document.querySelector('.cartao h1');
        // Seleciona o link do HTML para podermos controlá-lo
        const linkAviso = document.querySelector('#link-redirecionamento');

        botao.addEventListener('click', () => {
          titulo.style.color = '#e74c3c'; // Altera a cor do título
          
          // 1. Mostra o texto de aviso na tela
          linkAviso.style.display = 'block';
          
          // 2. Desabilita o botão para o usuário não clicar várias vezes
          botao.disabled = true;
          botao.style.backgroundColor = '#ccc';

          // 3. Executa a mudança de página após 3000 milissegundos (3 segundos)
          setTimeout(() => {
              window.location.href = 'modulo2.html';
          }, 3000);
        });
    </script>
</body>
</html>
