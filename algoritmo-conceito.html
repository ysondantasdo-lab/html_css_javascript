<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conceito Algoritimo</title>
    <link rel="stylesheet" href="style.css">    
</head>
<body>
  <header>
    <h1>Conceitos Básicos do Algoritmo</h1>
  </header>
    <section class="algoritmo-definicao">
        <h2>Definição de Algoritmo</h2>
        <p>Abaixo estão os cards gerados dinamicamente via JavaScript utilizando Flexbox.</p>
        
        <div id="lista-cards" class="flex-grid"></div>

        <!-- Seção de navegação adicionada para avançar de nível -->
        <div class="navegacao-container">
            <button id="btn-avancar" class="btn-proximo">Avançar para o Módulo 3</button>
            <p id="texto-aguarde" class="aviso-redirecionamento">Preparando ambiente... Redirecionando em 2 segundos.</p>
        </div>
    </section>    
</body>
</html>
